  <h1>Rio Local NAS Sync</h1>
  <p>個人用のNASとGoogle Driveの指定フォルダを、rcloneを使って同期するためのアプリです。一般向けのサービスや利用者登録機能はありません。</p>
  <p>Google Driveへのアクセス権限は、指定フォルダのファイルを読み取り、作成、更新、削除するために使用します。実際に同期するフォルダはNAS側の設定で指定します。</p>
